# Стенд: приложение подключается к внешней сети Caddy (имя сети — из PUBLIC_NETWORK).
services:
  mechanic-web:
    networks: [internal, public]
    environment:
      AUTH_DISABLED: "0"   # на стенде вход по паролю всегда, даже если в .env стоит 1

networks:
  public:
    external: true
    name: ${PUBLIC_NETWORK:-deploy_default}
