# Манифест базы знаний (KB_DIR/kb.yaml) — структура без данных.
#
# База знаний лежит вне репозитория и Docker-образа: каталог KB_DIR с PDF и этим манифестом.
# Новая база знаний = новый каталог с манифестом, код не меняется.
#
# Поля документа:
#   doc_id              — внутренний идентификатор (латиница), входит в chunk_id
#   manual              — обозначение для references[].manual в заявке, ровно как в ТЗ
#   file                — имя PDF внутри KB_DIR
#   engine_family       — ключ семейства из config/engines.json; по нему код фильтрует поиск
#   kind                — тип документа (РЭ, РК, ...)
#   pages               — число страниц PDF; сверяется при индексации
#   sha256              — необязательно; если задан, сверяется при индексации
#   edition, year       — необязательно; для подписи в интерфейсе
# Правила извлечения (необязательно):
#   page_number_offset  — напечатанный номер = индекс PDF + offset; null — общей нумерации нет.
#                         Строка-число в нижней полосе вырезается, только если совпадает
#                         с ожидаемым номером. Номер страницы везде = индекс PDF с 1.
#   strip_patterns      — регулярки колонтитулов в верхней/нижней полосе
#   title_band          — [y0, y1] в pt: полоса с названием карты операции (идёт в метаданные)
#   scan_pages          — страницы без текстового слоя или с разрушенным слоем;
#                         распознаются vision-моделью (scripts/ocr_scans.py), кеш в INDEX_DIR/ocr
manuals:
  - doc_id: example_re
    manual: "000.0000000 РЭ"
    file: example_re.pdf
    engine_family: example-family
    kind: РЭ
    pages: 100
    sha256: null
    edition: null
    year: 2020
    page_number_offset: 0
    strip_patterns: []
    title_band: null
    scan_pages: []
